<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gums N Teeth Dental Clinic</title>
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          function getFetch() {
            return currentFetch;
          }
          function setFetch(val) {
            currentFetch = val;
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        } catch (err) {}
      })();
    </script>
